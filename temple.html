<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติวัด · วัดพระธรรมกายในทวีปยุโรป</title>
<link rel="icon" type="image/png" href="assets/logo.png?v=1">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('temple-theme')||'light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

<!-- แถบบน -->
<div class="tpage-top">
  <div class="tpage-top-inner">
    <a class="tpage-back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      กลับหน้ารวมวัด
    </a>
    <span class="tpage-top-spacer"></span>
    <button class="tool-btn" id="themeBtn" title="สลับโหมดมืด/สว่าง" aria-label="สลับโหมด">
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>
</div>

<main id="tpage">
  <div class="loader" style="padding:80px 20px"><div class="spinner"></div>กำลังโหลดข้อมูลวัด…</div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="ปิด">✕</button>
  <button class="lightbox-nav prev" id="lbPrev" aria-label="ก่อนหน้า">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lightbox-nav next" id="lbNext" aria-label="ถัดไป">›</button>
</div>

<script src="config.js?v=9"></script>
<script src="data.js?v=9"></script>
<script src="shared.js?v=1"></script>
<script>
(function () {
  const S = window.Shared;
  const $ = s => document.querySelector(s);

  // ── ธีม ──
  function syncThemeIcons() {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    $("#iconMoon").style.display = dark ? "block" : "none";
    $("#iconSun").style.display  = dark ? "none"  : "block";
  }
  S.initTheme(); syncThemeIcons();
  $("#themeBtn").onclick = () => { S.toggleTheme(); syncThemeIcons(); };

  const id = new URLSearchParams(location.search).get("id");
  let gallery = [], lbIndex = 0;

  function personSVG() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>`;
  }

  function render(t) {
    document.title = (t.name || "ประวัติวัด") + " · วัดพระธรรมกายในทวีปยุโรป";
    const esc = S.esc, flag = S.flag;
    const initial = (t.name || "?").trim()[0] || "?";
    const logo = t.logo
      ? `<img class="tpage-logo" src="${esc(t.logo)}" alt="" onerror="this.outerHTML='<div class=\\'tpage-logo\\'>${esc(initial)}</div>'">`
      : `<div class="tpage-logo">${esc(initial)}</div>`;

    const aged = S.ageText(t.established);
    const murl = t.map_url || (t.address ? S.mapUrl(t.address) : "");
    gallery = S.splitList(t.gallery);

    const badges = [
      t.country ? `<span class="tpage-badge country">${flag(t.country)}${esc(t.country)}</span>` : "",
      aged ? `<span class="tpage-badge age"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg> สร้างมาแล้ว ${esc(aged)}</span>` : "",
      t.abbot ? `<span class="tpage-badge abbot">เจ้าอาวาส: ${esc(t.abbot)}</span>` : "",
    ].filter(Boolean).join("");

    const galleryHTML = gallery.length
      ? `<div class="tpage-gallery">${gallery.map((url, i) =>
          `<div class="tpage-gimg" onclick="__openLB(${i})"><img src="${esc(url)}" alt="ภาพวัด ${i + 1}" loading="lazy"></div>`).join("")}</div>`
      : `<div class="tpage-empty">— ยังไม่มีภาพของวัดนี้ —</div>`;

    const historyHTML = t.history && String(t.history).trim()
      ? `<div class="tpage-history">${esc(t.history)}</div>`
      : `<div class="tpage-empty">— ยังไม่มีข้อมูลประวัติของวัดนี้ —</div>`;

    $("#tpage").innerHTML = `
      <div class="tpage-hero">
        ${logo}
        <h1 class="tpage-name">${esc(t.name)}</h1>
        <div class="tpage-badges">${badges}</div>
      </div>
      <div class="tpage">
        <section class="tpage-section">
          <div class="tpage-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            ประวัติความเป็นมา
          </div>
          ${historyHTML}
        </section>

        <section class="tpage-section">
          <div class="tpage-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            ภาพวัดและกิจกรรม
          </div>
          ${galleryHTML}
        </section>

        ${murl ? `<a class="tpage-map" href="${esc(murl)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          นำทางไปวัด
        </a>` : ""}
      </div>`;
  }

  function renderNotFound() {
    $("#tpage").innerHTML = `<div class="tpage" style="padding-top:80px;text-align:center">
      <h1 class="tpage-name">ไม่พบข้อมูลวัด</h1>
      <p style="color:var(--text-dim);margin:16px 0 26px">ลิงก์อาจไม่ถูกต้อง หรือวัดนี้ถูกลบไปแล้ว</p>
      <a class="tpage-back" href="index.html">⟵ กลับหน้ารวมวัด</a>
    </div>`;
  }

  // ── Lightbox ──
  window.__openLB = function (i) {
    lbIndex = i; $("#lbImg").src = gallery[i]; $("#lightbox").classList.add("open");
    document.body.style.overflow = "hidden";
  };
  function lbShow(d) { lbIndex = (lbIndex + d + gallery.length) % gallery.length; $("#lbImg").src = gallery[lbIndex]; }
  function lbClose() { $("#lightbox").classList.remove("open"); document.body.style.overflow = ""; }
  $("#lbClose").onclick = lbClose;
  $("#lbPrev").onclick = e => { e.stopPropagation(); lbShow(-1); };
  $("#lbNext").onclick = e => { e.stopPropagation(); lbShow(1); };
  $("#lightbox").onclick = e => { if (e.target.id === "lightbox") lbClose(); };
  document.addEventListener("keydown", e => {
    if (!$("#lightbox").classList.contains("open")) return;
    if (e.key === "Escape") lbClose();
    else if (e.key === "ArrowLeft") lbShow(-1);
    else if (e.key === "ArrowRight") lbShow(1);
  });

  // ── โหลดข้อมูล ──
  S.loadTemplesShared().then(({ temples }) => {
    const t = temples.find(x => x.id === id);
    if (t) render(t); else renderNotFound();
  }).catch(renderNotFound);
})();
</script>
</body>
</html>
